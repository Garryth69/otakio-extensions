name: Weekly catalog sync

# Follows keiyoushi (sources removed there are removed here, new domains are picked up after a live probe, new
# sources are added when they pass a live test), drops
# other sources that failed every check for 90+ days, and commits the result to main. It runs unattended, so
# prune_repo.py holds everything back when a run would remove more than 8 sources or when the keiyoushi clone looks
# broken; sync.json records what happened and the status report (status.yml) shows it.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Garryth69/otakio
          path: app

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app/repo

      - name: keiyoushi build files (sparse)
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/keiyoushi/extensions-source.git kei
          cd kei
          git sparse-checkout init --no-cone
          printf '/src/*/*/build.gradle.kts\n/lib-multisrc/*/build.gradle.kts\n' > .git/info/sparse-checkout
          git checkout -q main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install lupa

      - name: Prune and follow upstream
        working-directory: app
        run: python tools/prune_repo.py --kei ../kei --probe --max-removals 8 --summary repo/sync.json

      # sources keiyoushi published since the catalog was generated: only those that pass a live test, 15 a week
      - name: Add new sources
        working-directory: app
        run: python tools/add_sources.py --kei ../kei --max 15 --summary repo/sync.json

      - name: Refresh README
        working-directory: app
        run: python tools/gen_repo_readme.py

      # changes made with the workflow token don't trigger other workflows (validate.yml): check the catalog here,
      # so a broken index.json or hash never reaches main
      - name: Validate the catalog
        working-directory: app
        run: python tools/validate_repo.py

      - name: Commit to main
        working-directory: app/repo
        run: |
          git config user.name "otakio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Catalog sync $(date -u +%Y-%m-%d)"
            git push
          fi
