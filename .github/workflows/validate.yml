name: Validate catalog

# Every push and pull request (including the weekly sync PR): index.json parses, ids are unique, every file exists,
# its sha256 matches what the app will download, and every .lua compiles. A mismatch would make the app refuse the install.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Garryth69/otakio
          path: app

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app/repo

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install -r app/tools/requirements.txt

      - name: Validate
        working-directory: app
        run: python tools/validate_repo.py --git

      # the robots' own tools on this catalog, writing nothing: an update (an action, Python, lupa) that breaks them
      # fails here, before it is merged
      - name: Robot dry run
        working-directory: app
        run: |
          python tools/prune_repo.py --dry-run --max-removals 8
          python tools/status_report.py --out "$RUNNER_TEMP/report.md"

  # Dependabot's updates merge themselves once the job above passes, major versions included: GitHub retires old
  # action runtimes, and an update left waiting for a person would stop the workflows while nobody maintains them
  automerge:
    needs: validate
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - run: gh pr merge "$PR" --squash --delete-branch --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
