name: Status report

# Keeps one issue, "Catalog status", up to date: working sources and what changed in the week, what the weekly sync
# did (or held back for a person), and how the robots themselves are doing. It also commits an empty "keepalive"
# when the repository has been quiet for 30 days: GitHub turns scheduled workflows off after 60 days without
# activity, and then the daily check would silently stop.
on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_run:
    workflows: ["Daily health check", "Weekly catalog sync"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  report:
    # after the other robots: only when one of them failed (the weekly schedule covers the rest)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Garryth69/otakio
          path: app

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app/repo
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Write the report
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          old=$(git -C repo rev-list -1 --before="7 days ago" HEAD || true)
          if [ -n "$old" ]; then git -C repo show "$old:health.json" > /tmp/old_health.json || rm -f /tmp/old_health.json; fi
          gh run list --repo "$REPO" -L 60 --json workflowName,conclusion,createdAt > /tmp/runs.json
          python tools/status_report.py $( [ -f /tmp/old_health.json ] && echo --old /tmp/old_health.json ) --runs /tmp/runs.json --out /tmp/report.md

      - name: Update the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create status --repo "$REPO" --color 0E8A16 --description "Automatic status report" 2>/dev/null || true
          num=$(gh issue list --repo "$REPO" --label status --state open --json number --jq '.[0].number')
          if [ -z "$num" ]; then
            url=$(gh issue create --repo "$REPO" --title "Catalog status" --label status --body-file /tmp/report.md)
            gh issue pin "$url" --repo "$REPO" || true
          else
            gh issue edit "$num" --repo "$REPO" --body-file /tmp/report.md
          fi

      - name: Keepalive
        working-directory: app/repo
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "otakio-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive: scheduled workflows stay on"
            git push
          else
            echo "recent activity: nothing to do"
          fi
