name: Daily health check

# Tests every source the way the app runs it (the app repository's Lua engines + tools/probe_sources.py).
# One request stream per site and few workers; blocks typical of datacenter IPs keep the previous result
# (flagged "unverified") instead of marking a working source as down.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Garryth69/otakio
          path: app

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app/repo

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install lupa

      - name: Probe every source
        working-directory: app
        run: python tools/probe_sources.py --workers 3 --ci --update-index

      - name: Refresh README
        working-directory: app
        run: python tools/gen_repo_readme.py

      # changes made with the workflow token don't trigger other workflows (validate.yml): check the catalog here,
      # so a broken index.json or hash never reaches main
      - name: Validate the catalog
        working-directory: app
        run: python tools/validate_repo.py

      - name: Commit if anything changed
        working-directory: app/repo
        run: |
          git config user.name "otakio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json health.json README.md SOURCES.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Health check $(date -u +%Y-%m-%d)"
            git push
          fi
